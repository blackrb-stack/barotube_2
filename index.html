<html lang="ko">

<title>BaroTube</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff0033'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E"/>
<style>
:root{--bg:#0f0f0f;--s1:#181818;--s2:#212121;--s3:#272727;--line:#303030;--tx:#f1f1f1;--mu:#aaa;--dim:#717171;--red:#ff0033;--red2:#cc0029;--amber:#ffb020;--green:#22c55e;--blue:#3ea6ff;--sbw:240px}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark;scrollbar-color:#3a3a3a #0f0f0f;scrollbar-width:thin}
body{background:var(--bg);color:var(--tx);font-family:Roboto,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;overflow-y:scroll;-webkit-font-smoothing:antialiased}
body.modal{overflow:hidden}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:8px;border:2px solid var(--bg)}::-webkit-scrollbar-thumb:hover{background:#555}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}img{display:block}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}.mu{color:var(--mu)}.dim{color:var(--dim)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cl3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#top{position:fixed;inset:0 0 auto 0;height:56px;z-index:50;display:flex;align-items:center;gap:8px;padding:0 14px;background:rgba(15,15,15,.92);backdrop-filter:blur(10px);border-bottom:1px solid #1c1c1c}
.ib{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}.ib:hover{background:var(--s3)}
#logo{display:flex;align-items:center;gap:7px;flex-shrink:0}
#logo .mk{width:30px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--red),var(--red2));display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(255,0,51,.45);animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 24px rgba(255,0,51,.65)}}
#logo .wd{font-size:19px;font-weight:800;letter-spacing:-.5px}#logo .wd b{color:var(--red)}
#sw{position:relative;flex:1;max-width:640px;margin:0 auto;display:flex;min-width:0}
#q{flex:1;min-width:0;height:40px;background:#121212;border:1px solid var(--line);border-right:none;border-radius:20px 0 0 20px;padding:0 16px;color:var(--tx);font-size:15px;outline:none}
#q:focus{border-color:var(--blue)}#q::placeholder{color:var(--dim)}
#sbtn{width:58px;height:40px;border:1px solid var(--line);border-radius:0 20px 20px 0;background:var(--s2);display:flex;align-items:center;justify-content:center;flex-shrink:0}#sbtn:hover{background:var(--s3)}
#sugs{position:absolute;top:46px;left:0;right:58px;background:#1c1c1c;border:1px solid #2c2c2c;border-radius:12px;padding:6px 0;box-shadow:0 12px 32px rgba(0,0,0,.6);z-index:60}
.sug{display:flex;align-items:center;gap:12px;width:100%;padding:7px 16px;font-size:15px;text-align:left}.sug:hover,.sug.on{background:var(--s3)}.sug svg{color:var(--dim);flex-shrink:0}
#cfgbtn{flex-shrink:0;border-radius:20px;padding:8px 14px;font-size:14px;color:var(--mu)}#cfgbtn:hover{background:var(--s3);color:var(--tx)}
#shell{display:flex;padding-top:56px;min-height:100vh}
#sb{position:fixed;top:56px;bottom:0;left:0;width:var(--sbw);overflow-y:auto;padding:12px;background:var(--bg);z-index:40;transition:transform .2s,width .2s}
.nv{display:flex;align-items:center;gap:20px;padding:10px 12px;border-radius:10px;font-size:14px}.nv:hover{background:#1f1f1f}.nv.on{background:var(--s3);font-weight:600}.nv svg{flex-shrink:0}
.hr{border:none;border-top:1px solid #222;margin:12px 0}
.sbt{font-size:14px;font-weight:600;color:var(--mu);padding:4px 12px 6px}
.sbe{font-size:12px;color:var(--dim);padding:4px 12px;line-height:1.6}
.si{display:flex;align-items:center;gap:14px;padding:8px 12px;border-radius:10px;font-size:14px}.si:hover{background:#1f1f1f}
.sbn{font-size:11px;color:#555;padding:4px 12px;line-height:1.6}
#main{flex:1;min-width:0;padding:0 24px 24px;margin-left:var(--sbw);transition:margin .2s}
#scrim{position:fixed;inset:56px 0 0 0;background:rgba(0,0,0,.6);z-index:35;display:none}
body.sbc{--sbw:72px}body.sbc .nv{flex-direction:column;gap:6px;padding:14px 4px;font-size:10px;text-align:center}body.sbc .sbf{display:none}
@media(max-width:1023px){#sb{transform:translateX(-100%);width:240px}#main{margin-left:0}body.sbo #sb{transform:none}body.sbo #scrim{display:block}body.sbc .nv{flex-direction:row;gap:20px;padding:10px 12px;font-size:14px;text-align:left}body.sbc .sbf{display:block}}
#ptr{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;gap:8px;color:var(--mu);font-size:13px}
#ptr .pic{transition:transform .15s}#ptr.ready .pic{transform:rotate(180deg)}#ptr.ready{color:var(--red)}
#feed{transition:transform .18s ease}#feed.drag{transition:none}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0}
.ph h1{font-size:20px;font-weight:800}.ph .rg{font-size:13px;font-weight:400;color:var(--dim);margin-left:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #3f3f3f;border-radius:20px;padding:8px 16px;font-size:14px}.btn:hover{background:var(--s3)}.btn:disabled{opacity:.5;cursor:default}
.btn.solid{background:var(--tx);color:#0f0f0f;border-color:var(--tx);font-weight:600}.btn.solid:hover{background:#d9d9d9}
.btn.warn{border-color:#5a4a1f;color:var(--amber)}.btn.warn:hover{background:#2a2410}
.ctr{display:flex;justify-content:center;padding:24px 0}
.state{display:flex;flex-direction:column;align-items:center;gap:12px;padding:64px 16px;text-align:center;color:var(--mu);font-size:14px}.state svg{color:var(--dim)}.state .msg{max-width:440px;line-height:1.6}
.spin{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.grid{display:grid;grid-template-columns:1fr;gap:32px 16px}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1536px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{animation:rise .35s ease both}@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.th{position:relative;display:block;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#1a1a1a}
.th img{width:100%;height:100%;object-fit:cover;transition:transform .2s}.card:hover .th img{transform:scale(1.03)}
.bg{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);font-size:12px;font-weight:600;padding:2px 6px;border-radius:4px}.bg.live{background:var(--red)}
.th .rm{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}.card:hover .rm{opacity:1}.th .rm:hover{background:#000}
.cm{display:flex;gap:12px;margin-top:12px}
.av{position:relative;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#3a3a3a,#2a2a2a);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.av img{width:100%;height:100%;object-fit:cover}.av i{display:none;font-style:normal;font-weight:700;color:var(--mu)}.av.noimg i{display:block}
.ct{font-size:15px;font-weight:600;line-height:1.35}.ct:hover{color:#fff}
.cc{font-size:13px;color:var(--mu);margin-top:4px}.cc:hover{color:var(--tx)}
.cs{font-size:13px;color:var(--mu);margin-top:1px}
.sk{border-radius:12px;background:linear-gradient(90deg,#1a1a1a 25%,#242424 50%,#1a1a1a 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.sk.t{aspect-ratio:16/9}.sk.l{height:14px;margin-top:10px}.sk.l.s{width:60%}
.row{display:flex;gap:16px;animation:rise .3s ease both}.row .th{width:360px;flex-shrink:0}.row .rt{font-size:18px;font-weight:600;line-height:1.35}
@media(max-width:639px){.row{flex-direction:column}.row .th{width:100%}}
.comp{display:flex;gap:8px}.comp .th{width:168px;flex-shrink:0;border-radius:8px}.comp .ct{font-size:14px}.comp .cc,.comp .cs{font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{background:var(--s3);border-radius:8px;padding:6px 12px;font-size:14px}.chip:hover{background:#333}.chip.on{background:var(--tx);color:#0f0f0f;font-weight:600}
.chip.sub{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:5px 6px 5px 14px}.chip.sub button{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}.chip.sub button:hover{background:#444}
.watch{display:flex;gap:24px;max-width:1700px;margin:20px auto 0}
.wl{flex:1;min-width:0}.wr{width:400px;flex-shrink:0}
@media(max-width:1279px){.watch{flex-direction:column}.wr{width:100%}}
.pl{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.pl video,.pl iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--mu);font-size:14px;background:#000}
.pfail{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(ellipse at center,#1a1214,#000)}
.pfail h3{font-size:16px}.pfail p{font-size:13px;color:var(--mu);max-width:420px;line-height:1.6}
.pfail .row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:8px;font-size:12px;color:var(--dim)}
.pbar .st{display:inline-flex;align-items:center;gap:6px}.pbar .st.ok{color:var(--green)}.pbar .st.warn{color:var(--amber)}
.pbar button,.pbar a{display:inline-flex;align-items:center;gap:4px}.pbar button:hover,.pbar a:hover{color:var(--tx)}
.wt{font-size:20px;font-weight:800;line-height:1.3;margin-top:12px}
.wch{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:12px}
.wch .nm{font-size:15px;font-weight:600}.wch .sc{font-size:12px;color:var(--mu)}
.subbtn{border-radius:20px;padding:8px 16px;font-size:14px;font-weight:600;background:var(--tx);color:#0f0f0f;display:inline-flex;align-items:center;gap:6px}.subbtn:hover{background:#d9d9d9}
.subbtn.on{background:var(--s3);color:var(--tx)}.subbtn.on:hover{background:#333}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--s3);border-radius:20px;padding:8px 16px;font-size:14px}.pill:hover{background:#333}
.wact{margin-left:auto;display:flex;gap:8px}
.desc{background:#1f1f1f;border-radius:12px;padding:12px;font-size:14px;margin-top:12px;line-height:1.55}
.desc .body{white-space:pre-wrap;word-break:break-word;margin-top:6px}.desc a{color:var(--blue)}
.desc .more{font-weight:600;color:var(--mu);margin-top:6px}.desc .more:hover{color:var(--tx)}
.auto{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mu);margin-bottom:12px}.auto input{accent-color:var(--red);width:16px;height:16px}
.rel{display:flex;flex-direction:column;gap:10px}
.coms{margin-top:24px}.coms h2{font-size:16px;font-weight:700;margin-bottom:16px}
.com{display:flex;gap:12px;margin-bottom:18px}.com .ca{font-size:12px;font-weight:600}.com .ct2{font-size:12px;color:var(--dim)}
.com .tx{font-size:14px;white-space:pre-wrap;word-break:break-word;margin-top:3px;line-height:1.5}
.com .lk{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--dim);margin-top:5px}
.pin{background:#3a3a3a;border-radius:4px;padding:1px 5px;font-size:10px;margin-right:5px}
.chhead{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 24px}
.chhead h1{font-size:24px;font-weight:800;display:flex;align-items:center;gap:6px}
.banner{width:100%;height:180px;object-fit:cover;border-radius:12px;margin-top:20px}
@media(max-width:639px){.banner{height:110px}}
.htools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.htools input{height:36px;background:#121212;border:1px solid var(--line);border-radius:18px;padding:0 14px;color:var(--tx);font-size:14px;outline:none;width:180px}.htools input:focus{border-color:var(--blue)}
.htools select{height:36px;background:var(--s2);border:1px solid var(--line);border-radius:18px;padding:0 12px;color:var(--tx);font-size:14px}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.panel{background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:24px;width:min(460px,100%);max-height:85vh;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.panel h2{font-size:18px;font-weight:800}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px}.fld span{color:var(--mu)}
.fld select,.fld textarea{background:var(--s2);border:1px solid #3f3f3f;border-radius:8px;padding:8px 10px;color:var(--tx);font:inherit}
.fld textarea{font-family:ui-monospace,monospace;font-size:12px;resize:vertical}
.fld .hint{font-size:12px;color:var(--dim);line-height:1.55}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}.chk input{accent-color:var(--red);width:16px;height:16px}
.pbtns{display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--tx);color:#0f0f0f;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:80;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{color:var(--red2);font-weight:800;text-decoration:underline;flex-shrink:0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<header id="top">
  <button class="ib" id="menu" aria-label="메뉴"></button>
  <a id="logo" href="#/"><span class="mk" id="logomk"></span><span class="wd">Baro<b>Tube</b></span></a>
  <div id="sw">
    <input id="q" placeholder="검색" autocomplete="off" aria-label="검색"/>
    <button id="sbtn" aria-label="검색"></button>
    <div id="sugs" class="hidden"></div>
  </div>
  <button id="cfgbtn">설정</button>
</header>
<div id="shell">
  <aside id="sb"></aside>
  <div id="scrim"></div>
  <main id="main"></main>
</div>
<div id="modal" class="hidden">
  <div class="panel">
    <h2>설정</h2>
    <label class="fld"><span>홈 피드 지역</span><select id="c_region"></select></label>
    <label class="chk"><input type="checkbox" id="c_auto"/> 동영상 종료 후 자동 재생</label>
    <label class="chk"><input type="checkbox" id="c_embed"/> 프록시 실패 시 임베드 자동 재생 (광고 표시될 수 있음)</label>
    <label class="fld"><span>내 Piped API 서버 (줄당 1개, 최우선 사용)</span>
      <textarea id="c_inst" rows="3" placeholder="https://my-piped.example.com"></textarea>
      <span class="hint">공개 서버의 재생 프록시는 유튜브 차단으로 수시로 막힙니다. 광고 100% 제거를 원하면 Piped를 셀프호스팅한 뒤 주소를 추가하세요. 임베드 재생에는 광고가 붙을 수 있습니다.</span>
    </label>
    <div class="pbtns"><button class="btn" id="c_cancel">취소</button><button class="btn solid" id="c_save">저장</button></div>
  </div>
</div>
<div id="toast" role="status"></div>
<script>
"use strict";
(function(){
/* ── 유틸 ── */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vidOk=s=>/^[A-Za-z0-9_-]{6,20}$/.test(s||"");
const fmtN=n=>n<0?"":n>=1e8?(n/1e8).toFixed(1).replace(/\.0$/,"")+"억":n>=1e4?(n/1e4).toFixed(1).replace(/\.0$/,"")+"만":n>=1e3?(n/1e3).toFixed(1).replace(/\.0$/,"")+"천":""+n;
const fmtD=s=>{if(s<0)return"LIVE";const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);return(h?h+":":"")+(h?String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const koT=s=>String(s||"").replace(/(\d+)\s*seconds? ago/,"$1초 전").replace(/(\d+)\s*minutes? ago/,"$1분 전").replace(/(\d+)\s*hours? ago/,"$1시간 전").replace(/(\d+)\s*days? ago/,"$1일 전").replace(/(\d+)\s*weeks? ago/,"$1주 전").replace(/(\d+)\s*months? ago/,"$1개월 전").replace(/(\d+)\s*years? ago/,"$1년 전").replace("Streamed ","스트리밍: ");
const ago=(u,d)=>{if(u>0){const m=Math.floor((Date.now()-u)/6e4);if(m<1)return"방금 전";if(m<60)return m+"분 전";const h=Math.floor(m/60);if(h<24)return h+"시간 전";const D=Math.floor(h/24);if(D<7)return D+"일 전";if(D<30)return Math.floor(D/7)+"주 전";if(D<365)return Math.floor(D/30)+"개월 전";return Math.floor(D/365)+"년 전"}return d?koT(d):""};
const stripH=s=>String(s||"").replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]*>/g,"");
const linkify=t=>String(t||"").split(/(https?:\/\/[^\s]+)/g).map(p=>/^https?:\/\//.test(p)?`<a href="${esc(p)}" target="_blank" rel="noreferrer">${esc(p)}</a>`:esc(p)).join("");
const vidOf=u=>{const q=String(u||"").split("?")[1];return q?new URLSearchParams(q).get("v")||"":""};
const listOf=u=>{const q=String(u||"").split("?")[1];return q?new URLSearchParams(q).get("list")||"":""};
const chOf=u=>u&&u.startsWith("/channel/")?u.slice(9).split(/[/?#]/)[0]:"";

 const inv=(async()=>{let last;for(const b of pool(INVID,dI).slice(0,3)){try{const d=await jget(b+"/api/v1/videos/"+id+"?local=true&fields=title,author,authorId,authorThumbnails,viewCount,likeCount,lengthSeconds,descriptionHtml,recommendedVideos,formatStreams",7000);const det={title:d.title,uploader:d.author,uploaderUrl:"/channel/"+d.authorId,uploaderAvatar:ivAv(d.authorThumbnails),views:d.viewCount??-1,likes:d.likeCount??-1,duration:d.lengthSeconds??0,uploaded:0,description:stripH(d.descriptionHtml),related:(d.recommendedVideos||[]).map(ivMap)};const fs=d.formatStreams||[];const pick=fs.find(f=>String(f.itag)==="18")||fs.find(f=>String(f.itag)==="22")||fs[0];if(pick&&pick.url)return{kind:"mp4",url:pick.url,inv:b,d:det};return{kind:"hls",url:b+"/api/manifest/hls_variant/id/"+id,d:det}}catch(e){last=e;dI.set(b,Date.now()+6e4)}}throw last||Error("inv 실패")})();

sugs.addEventListener("mousedown",e=>{const b=e.target.closest(".sug");if(!b)return;e.preventDefault();const s=sugList[Number(b.dataset.i)];q.value=s;go(s)});
$("#sbtn").addEventListener("click",()=>go(q.value));
function go(text){const v=String(text||"").trim();if(!v)return;hideSugs();q.blur();nav("/results?q="+encodeURIComponent(v)+"&filter=all")}
/* ── 사이드바 토글 ── */
$("#menu").addEventListener("click",()=>{if(matchMedia("(max-width:1023px)").matches)document.body.classList.toggle("sbo");else document.body.classList.toggle("sbc")});
$("#scrim").addEventListener("click",()=>document.body.classList.remove("sbo"));
/* ── 설정 ── */
const REGIONS=["KR","US","JP","GB","DE","FR","IN","BR","CA","AU"];
$("#c_region").innerHTML=REGIONS.map(r=>`<option value="${r}">${r}</option>`).join("");
$("#cfgbtn").addEventListener("click",()=>{$("#c_region").value=cfg.region;$("#c_auto").checked=cfg.autoplay;$("#c_embed").checked=cfg.autoEmbed;$("#c_inst").value=(cfg.custom||[]).join("\n");$("#modal").classList.remove("hidden");document.body.classList.add("modal")});
const closeModal=()=>{$("#modal").classList.add("hidden");document.body.classList.remove("modal")};
$("#c_cancel").addEventListener("click",closeModal);
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").classList.contains("hidden"))closeModal()});
$("#c_save").addEventListener("click",()=>{cfg.region=$("#c_region").value;cfg.autoplay=$("#c_auto").checked;cfg.autoEmbed=$("#c_embed").checked;cfg.custom=$("#c_inst").value.split("\n").map(x=>x.trim().replace(/\/+$/,"")).filter(x=>/^https?:\/\//.test(x));save("bt2_cfg",cfg);closeModal();toast("설정을 저장했어요");render()});
/* ── 시작 ── */
window.addEventListener("hashchange",()=>{document.body.classList.remove("sbo");render()});
renderSB();render();
})();
</script>
